<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Aula — organizador académico personal: materias, parciales, planes de estudio, hábitos y estadísticas.">
<meta name="theme-color" content="#4338ca">
<title>Aula · Organizador académico</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* Bootstrap de tema antes del primer pintado para evitar flash */
(function(){
  try{
    var t=localStorage.getItem('aula-theme')||'auto';
    var dark = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark?'dark':'light';
    document.documentElement.dataset.themePref = t;
    var acc=localStorage.getItem('aula-accent'); if(acc) document.documentElement.style.setProperty('--acc',acc);
  }catch(e){}
})();
</script>
<style>
/* ============ VARIABLES DE TEMA ============ */
:root{
  --acc:#4338ca;
  --r:12px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --card:#ffffff; --card2:#f1f3f6; --line:#e4e7ec; --line2:#eef0f4;
  --tx:#101828; --tx2:#475467; --tx3:#98a2b3;
  --acc-soft:color-mix(in srgb,var(--acc) 9%,#ffffff);
  --acc-line:color-mix(in srgb,var(--acc) 28%,#ffffff);
  --ok:#067647; --ok-soft:#ecfdf3; --warn:#b54708; --warn-soft:#fffaeb; --bad:#b42318; --bad-soft:#fef3f2;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
  --backdrop:rgba(16,24,40,.45);
  --hover:#f8fafb;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --card:#161b24; --card2:#1d2430; --line:#2a3342; --line2:#232b38;
  --tx:#eef1f6; --tx2:#a8b3c4; --tx3:#66738a;
  --acc-soft:color-mix(in srgb,var(--acc) 22%,#161b24);
  --acc-line:color-mix(in srgb,var(--acc) 45%,#161b24);
  --ok:#3ccb7f; --ok-soft:#12261c; --warn:#f0b13c; --warn-soft:#2a2213; --bad:#f27a6c; --bad-soft:#2b1917;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 16px 44px rgba(0,0,0,.55);
  --backdrop:rgba(3,6,12,.62);
  --hover:#1a212c;
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14.5px;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s}
button{font-family:inherit}
input,select,textarea{font-family:inherit;color:var(--tx)}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:4px}
/* ============ TOPBAR ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:54px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:60}
#topbar .logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:1rem}
#topbar .logo .mark{width:26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
#topbar .date{font-size:.75rem;color:var(--tx3);margin-left:2px}
#topbar .spacer{flex:1}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--tx2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;line-height:1}
.iconbtn:hover{background:var(--hover);border-color:var(--line)}
#saveInd{font-size:.7rem;color:var(--tx3);display:flex;align-items:center;gap:6px;white-space:nowrap}
#saveInd .dot{width:7px;height:7px;border-radius:50%;background:#12b76a;flex-shrink:0}
#saveInd.saving .dot{background:var(--warn)}
#saveInd.sync-busy .dot{background:var(--acc)}
#saveInd.sync-offline .dot,#saveInd.sync-nokv .dot,#saveInd.sync-newer .dot{background:var(--warn)}
#saveInd.sync-error .dot,#saveInd.sync-badkey .dot{background:var(--bad)}
#nextEv{font-size:.72rem;color:var(--tx2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#nextEv b{color:var(--bad)}
#searchbox{position:relative}
#searchbox input{width:200px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.8rem}
/* ============ SIDEBAR ============ */
#sidebar{position:fixed;top:54px;left:0;bottom:0;width:228px;background:var(--card);border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto;z-index:55;transform:translateX(-100%);transition:transform .18s}
body.sb-open #sidebar{transform:translateX(0)}
#sidebar .sec{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:700;padding:12px 10px 5px}
#sidebar a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--tx2);text-decoration:none;font-size:.83rem;font-weight:500;margin-bottom:1px}
#sidebar a:hover{background:var(--hover);color:var(--tx)}
#sidebar a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
/* volver atrás estilo iOS: texto en color de acento sobre el título */
.backlink{background:none;border:none;color:var(--acc);font:inherit;font-size:.9rem;font-weight:500;padding:0 4px 0 0;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;margin:-10px 0 -4px}
.backlink:hover{opacity:.75}
/* hora de una tarea/evento: chiquita, tabular, en color de acento */
.ttime{font-variant-numeric:tabular-nums;font-weight:600;color:var(--acc);margin-right:6px;font-size:.92em}
.wtask .ttime{margin-right:4px}
/* comentarios de tareas (B2) */
.cmt{background:var(--card2);border-radius:10px;padding:9px 11px;margin:6px 0}
.cmt-meta{font-size:.68rem;color:var(--tx3);margin-bottom:3px}
.cmt-text{font-size:.84rem;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
.cmt-act{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.cmt-act .btn.ghost{border-color:transparent;background:none;color:var(--tx3);min-height:36px;padding:4px 10px}
.cmt-act .btn.ghost:hover{color:var(--tx)}
.cmt textarea{width:100%}
.cmt-new{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.cmt-new textarea{flex:1;min-height:40px;resize:vertical}
.cmtcount{display:inline-flex;align-items:center;gap:3px;color:var(--tx3)}
#sbBackdrop{position:fixed;inset:0;background:var(--backdrop);z-index:54;display:none}
/* ============ LAYOUT ============ */
#main{padding:70px 18px 120px;max-width:1180px;margin:0 auto;transition:margin .18s}
@media(min-width:980px){
  body.sb-open #main{margin-left:228px;max-width:none;padding-left:26px;padding-right:26px}
  body.sb-open #main .inner{max-width:1120px;margin:0 auto}
}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vhead h2{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.vhead .sub{font-size:.78rem;color:var(--tx3)}
.vhead .grow{flex:1}
/* ============ COMPONENTES ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:.9rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.muted{color:var(--tx2);font-size:.8rem}
.tiny{color:var(--tx3);font-size:.71rem}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx2);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:600;transition:.13s;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:.7rem}
.btn.ghost{background:transparent;box-shadow:none}
.tag{font-size:.62rem;padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:.03em;white-space:nowrap;display:inline-block}
.pill{font-size:.66rem;padding:2px 9px;border-radius:99px;font-weight:600;border:1px solid var(--line);color:var(--tx2);display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;flex:1}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.statnum{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statlab{font-size:.7rem;color:var(--tx3)}
.empty{padding:26px;text-align:center;color:var(--tx3);font-size:.8rem}
.hr{border:none;border-top:1px solid var(--line2);margin:10px 0}
/* tareas */
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 8px;border-radius:8px;transition:background-color .12s;cursor:pointer}
.task:hover{background:var(--hover)}
.task.done .tt{text-decoration:line-through;color:var(--tx3)}
.task .tt{font-size:.84rem;line-height:1.35}
.task .tinfo{flex:1;min-width:0}
.task .tmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:3px}
.cb{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--tx3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:.14s;background:transparent;margin-top:1px}
.cb:hover{border-color:var(--acc)}
.cb.on{background:var(--acc);border-color:var(--acc)}
.mins{font-size:.69rem;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.prio2{color:var(--bad);font-weight:700;font-size:.66rem}
.prio0{color:var(--tx3);font-size:.66rem}
.tactions{display:flex;gap:4px;opacity:0;transition:opacity .12s;flex-shrink:0}
.task:hover .tactions{opacity:1}
.tactions button{background:var(--card);border:1px solid var(--line);color:var(--tx3);height:24px;min-width:24px;padding:0 5px;border-radius:6px;cursor:pointer;font-size:.62rem}
.tactions button:hover{color:var(--acc);border-color:var(--acc)}
/* X2 · En pantallas táctiles no hay hover: estas acciones nunca se veían pero
   ocupaban la mitad del ancho de la fila. Tocar la tarea abre su detalle. */
@media (hover:none){.tactions{display:none}}
/* arrastrar para ordenar el día */
.drag{cursor:grab;color:var(--tx3);font-size:.72rem;line-height:1;padding:3px 2px;margin-top:2px;flex-shrink:0;opacity:.35;transition:opacity .12s,color .12s;letter-spacing:-2px;user-select:none;touch-action:none}
.task:hover .drag{opacity:.9;color:var(--acc)}
.drag:active{cursor:grabbing}
/* selección múltiple */
.task.sel{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.task.sel:hover{background:var(--acc-soft)}
#selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(140%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow-lg);z-index:110;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:min(96vw,980px);transition:transform .2s;opacity:0}
#selbar.show{transform:translateX(-50%) translateY(0);opacity:1}
#selbar .selcount{font-size:.78rem;color:var(--tx2);padding:0 6px;white-space:nowrap}
#selbar .selcount b{color:var(--acc);font-size:.95rem}
body.selbar-on #main{padding-bottom:230px}
@media(max-width:720px){#selbar{bottom:8px;padding:7px 8px;gap:4px}#selbar .btn{padding:4px 7px;font-size:.68rem}}
/* minutos del día en el calendario */
.cal .dnum .dmin{float:right;font-weight:600;color:var(--tx3);font-size:.6rem}
.task.dropbefore{box-shadow:inset 0 3px 0 -1px var(--acc)}
/* B4 · mover y arrastrar tareas */
.oldDone{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px;color:var(--tx3);text-align:center}
/* C1 · repetir */
.wdpick{display:flex;gap:6px;flex-wrap:wrap}
.wdpick button{flex:1;min-width:36px;max-width:48px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);font-weight:700;font-size:.8rem;cursor:pointer;transition:background-color .15s,color .15s}
.wdpick button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.reppreview{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--acc-soft);border:1px solid var(--acc-line);font-size:.8rem;color:var(--tx)}
.reppreview.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.repdates{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.repdate{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:.74rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.repdate.more{color:var(--tx3)}
@media (prefers-reduced-motion:reduce){.wdpick button{transition:none}}
/* C2a · editor de serie */
.btn:disabled{opacity:.45;cursor:default}
.srbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.srbar .btn{min-height:32px}
.occlist{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:min(46vh,360px);background:var(--card)}
.occ{display:flex;align-items:stretch;border-bottom:1px solid var(--line2);transition:background-color .15s}
.occ:last-child{border-bottom:none}
.occ.on{background:var(--acc-soft)}
.modal label.occl{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 4px 6px 14px;margin:0;cursor:pointer;text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:500;color:var(--tx)}
.modal label.occl input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--acc);padding:0}
:root[data-theme="dark"] .modal label.occl input{color-scheme:dark}
.occmore{flex:none;min-width:64px;background:none;border:none;border-left:1px solid var(--line2);color:var(--acc);font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;padding:0 12px}
.occmore:hover{background:var(--hover)}
.occ.open{background:var(--card2)}
.occedit{padding:4px 14px 12px;background:var(--card2);border-bottom:1px solid var(--line2)}
.occstep{display:flex;align-items:center;gap:8px;padding-top:6px}
.occstep .tiny{flex:1}
.occstep .btn{min-height:40px;min-width:60px;font-variant-numeric:tabular-nums}
.modal .occstep input{width:84px;text-align:center;min-height:40px}
.occacts{display:flex;gap:8px;margin-top:10px;align-items:center}
.occacts .btn{min-height:36px}
.occacts .grow{flex:1}
.sradd{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.sradd[open]{padding-bottom:12px}
.sradd summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--acc);min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
.sradd summary::-webkit-details-marker{display:none}
.sradd summary::before{content:"+";font-size:1.1rem;line-height:1;font-weight:700}
.occ .occd{flex:1;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ .occst{font-size:.72rem;color:var(--tx3);white-space:nowrap}
.occ.done .occst{color:var(--ok,#16a34a)}
.occ.done .occd{color:var(--tx3)}
.occ .occm{font-variant-numeric:tabular-nums;font-weight:600;min-width:62px;text-align:right;white-space:nowrap}
.srbulk{margin-top:12px}
.srbulk .mrow>div.srx{flex:1}
.srchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.srchips .btn{min-height:32px;font-variant-numeric:tabular-nums}
.srapply{width:100%;margin-top:10px;min-height:44px;font-size:.85rem}
.srmore{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px}
.srmore summary{cursor:pointer;font-size:.8rem;font-weight:600;color:var(--tx2);min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
.srmore summary::-webkit-details-marker{display:none}
.srmore summary::before{content:"›";font-size:1.1rem;line-height:1;color:var(--tx3);transition:transform .18s}
.srmore[open] summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.occ,.srmore summary::before{transition:none}}
@media(max-width:600px){.srbulk .mrow,.sradd .mrow{flex-direction:column;gap:0}}
/* C4 · tiempos por tramos y selección rápida */
.trtoggle{display:flex!important;align-items:center;gap:10px;min-height:44px;margin:10px 0 0!important;text-transform:none!important;letter-spacing:0!important;font-size:.85rem!important;font-weight:600!important;color:var(--tx)!important;cursor:pointer}
.modal .trtoggle input{width:22px;height:22px;margin:0;padding:0;accent-color:var(--acc);flex:none}
.trbox{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.trrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 36px;align-items:center;gap:8px}
.modal .trrow select{min-height:40px;margin:0;font-variant-numeric:tabular-nums}
.trhint{margin:0 0 2px;color:var(--tx3)}
.trde{font-size:.82rem;color:var(--tx2);white-space:nowrap}
.trdel{width:36px;height:36px;border:none;border-radius:50%;background:none;color:var(--tx3);font-size:.85rem;cursor:pointer}
button.trdel:hover{background:var(--hover);color:var(--bad)}
.tradd{align-self:flex-start;background:none;border:none;color:var(--acc);font:inherit;font-size:.82rem;font-weight:600;min-height:40px;padding:0 2px;cursor:pointer}
.srrange{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.modal .srrange input{width:52px;min-height:36px;margin:0;text-align:center;font-variant-numeric:tabular-nums;padding:4px}
.srrange .btn{min-height:36px}
.occ .occn{flex:none;min-width:20px;font-size:.7rem;color:var(--tx3);font-variant-numeric:tabular-nums;text-align:right}
.modal label.occl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button.occm{flex:none;background:none;border:none;border-left:1px solid var(--line2);font:inherit;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--acc);min-width:100px;padding:0 10px;text-align:right;cursor:pointer;white-space:nowrap}
button.occm:hover{background:var(--hover)}
.occ.done button.occm{color:var(--tx3)}
.modal input.occmin{flex:none;width:76px;min-height:0;margin:6px 6px 6px 0;padding:4px 8px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;border-radius:8px}
.srhint{margin:6px 2px 0;color:var(--tx3)}
.srquick{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line2)}
.srquick .srchips{margin-top:6px}
.srquick .srchips .btn{min-height:40px;min-width:56px}
.srquick.off .srchips{opacity:.45;pointer-events:none}
@media(max-width:600px){.trrow{gap:6px}}
/* C3 · series integradas */
.serlist{padding:0;overflow:hidden}
.serrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;background:none;border:none;border-bottom:1px solid var(--line2);color:var(--tx);font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
.serrow:last-child{border-bottom:none}
.serrow:hover{background:var(--hover)}
.serdot{width:10px;height:10px;border-radius:50%;flex:none}
.sermain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sertitle{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sermain .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serpct{width:44px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.serpct i{display:block;height:100%;background:var(--acc);border-radius:99px}
.serchev{color:var(--tx3);font-size:1.2rem;line-height:1;flex:none}
.sermore{padding:0}
