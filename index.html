<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Aula — organizador académico personal: materias, parciales, planes de estudio, hábitos y estadísticas.">
<meta name="theme-color" content="#4338ca">
<title>Aula · Organizador académico</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* Bootstrap de tema antes del primer pintado para evitar flash */
(function(){
  try{
    var t=localStorage.getItem('aula-theme')||'auto';
    var dark = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark?'dark':'light';
    document.documentElement.dataset.themePref = t;
    var acc=localStorage.getItem('aula-accent'); if(acc) document.documentElement.style.setProperty('--acc',acc);
  }catch(e){}
})();
</script>
<style>
/* ============ VARIABLES DE TEMA ============ */
:root{
  --acc:#4338ca;
  --r:12px;
  --r-sm:8px;
  --r-lg:16px;
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f8fafc; --card:#ffffff; --card2:#f1f5f9; --line:#e2e8f0; --line2:#edf2f7;
  --tx:#0f172a; --tx2:#475569; --tx3:#94a3b8;
  --acc-soft:color-mix(in srgb,var(--acc) 10%,#ffffff);
  --acc-line:color-mix(in srgb,var(--acc) 30%,#ffffff);
  --ok:#059669; --ok-soft:#ecfdf5; --warn:#d97706; --warn-soft:#fffbeb; --bad:#dc2626; --bad-soft:#fef2f2;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 3px 8px rgba(15,23,42,.06);
  --shadow-lg:0 16px 36px rgba(15,23,42,.14);
  --backdrop:rgba(15,23,42,.45);
  --hover:#f1f5f9;
  --topbar-bg:rgba(255,255,255,.88);
}
:root[data-theme="dark"]{
  --bg:#090d16; --card:#111726; --card2:#172033; --line:#243049; --line2:#1c263a;
  --tx:#f1f5f9; --tx2:#94a3b8; --tx3:#64748b;
  --acc-soft:color-mix(in srgb,var(--acc) 22%,#111726);
  --acc-line:color-mix(in srgb,var(--acc) 45%,#111726);
  --ok:#10b981; --ok-soft:#06281e; --warn:#f59e0b; --warn-soft:#291c04; --bad:#ef4444; --bad-soft:#2e1010;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);
  --shadow:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 18px 48px rgba(0,0,0,.7);
  --backdrop:rgba(2,6,15,.68);
  --hover:#192338;
  --topbar-bg:rgba(17,23,38,.88);
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14.5px;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit}
input,select,textarea{font-family:inherit;color:var(--tx)}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
/* ============ TOPBAR ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--topbar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:60;transition:background .2s}
#topbar .logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em;font-size:1.05rem;cursor:pointer}
#topbar .logo .mark{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#topbar .date{font-size:.78rem;color:var(--tx3);margin-left:4px;font-weight:500}
#topbar .spacer{flex:1}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--tx2);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .15s}
.iconbtn:hover{background:var(--hover);border-color:var(--line);color:var(--tx)}
#saveInd{font-size:.7rem;color:var(--tx3);display:flex;align-items:center;gap:6px;white-space:nowrap}
#saveInd .dot{width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0;transition:background .2s}
#saveInd.saving .dot{background:var(--warn)}
#nextEv{font-size:.74rem;color:var(--tx2);border:1px solid var(--line);border-radius:9px;padding:5px 12px;cursor:pointer;background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;box-shadow:var(--shadow-sm);transition:all .15s}
#nextEv:hover{border-color:var(--acc-line);color:var(--tx)}
#nextEv b{color:var(--bad)}
#searchbox{position:relative}
#searchbox input{width:200px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:.8rem;cursor:pointer;transition:all .15s}
#searchbox input:hover{border-color:var(--acc-line)}
/* ============ SIDEBAR ============ */
#sidebar{position:fixed;top:56px;left:0;bottom:0;width:235px;background:var(--card);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;z-index:55;transform:translateX(-100%);transition:transform .2s cubic-bezier(.16,1,.3,1)}
body.sb-open #sidebar{transform:translateX(0)}
#sidebar .sec{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);font-weight:700;padding:12px 10px 6px}
#sidebar a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;color:var(--tx2);text-decoration:none;font-size:.84rem;font-weight:500;margin-bottom:2px;transition:all .14s}
#sidebar a:hover{background:var(--hover);color:var(--tx)}
#sidebar a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
#sbBackdrop{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(2px);z-index:54;display:none}
/* ============ LAYOUT ============ */
#main{padding:74px 20px 120px;max-width:1200px;margin:0 auto;transition:margin .2s cubic-bezier(.16,1,.3,1)}
@media(min-width:980px){
  body.sb-open #main{margin-left:235px;max-width:none;padding-left:32px;padding-right:32px}
  body.sb-open #main .inner{max-width:1140px;margin:0 auto}
}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.vhead h2{font-size:1.25rem;font-weight:800;letter-spacing:-.03em}
.vhead .sub{font-size:.8rem;color:var(--tx3);font-weight:500}
.vhead .grow{flex:1}
/* ============ COMPONENTES ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:border-color .15s}
.card h3{font-size:.92rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.muted{color:var(--tx2);font-size:.82rem}
.tiny{color:var(--tx3);font-size:.72rem}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx2);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.79rem;font-weight:600;transition:.14s;box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--tx3);color:var(--tx);box-shadow:var(--shadow)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.72rem}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--hover);border-color:var(--line)}
.tag{font-size:.64rem;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.pill{font-size:.67rem;padding:3px 9px;border-radius:99px;font-weight:600;border:1px solid var(--line);color:var(--tx2);display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;flex:1}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.statnum{font-size:1.65rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.statlab{font-size:.72rem;color:var(--tx3);margin-top:2px}
.empty{padding:28px;text-align:center;color:var(--tx3);font-size:.82rem}
.hr{border:none;border-top:1px solid var(--line2);margin:12px 0}

/* ============ TAREAS ============ */
.task{display:flex;align-items:flex-start;gap:11px;padding:9px 10px;border-radius:9px;transition:background .12s,box-shadow .12s,transform .12s;cursor:pointer;position:relative}
.task:hover{background:var(--hover)}
.task.done .tt{text-decoration:line-through;color:var(--tx3)}
.task .tt{font-size:.86rem;line-height:1.35;word-break:break-word}
.task .tinfo{flex:1;min-width:0}
.task .tmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px}
.cb{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--tx3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .14s;background:transparent;margin-top:1px}
.cb:hover{border-color:var(--acc);transform:scale(1.05)}
.cb.on{background:var(--acc);border-color:var(--acc)}
.mins{font-size:.7rem;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
.time-pill{font-size:.67rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.prio2{color:var(--bad);font-weight:700;font-size:.67rem}
.prio0{color:var(--tx3);font-size:.67rem}
.tactions{display:flex;gap:4px;opacity:0;transition:opacity .14s;flex-shrink:0}
.task:hover .tactions{opacity:1}
.tactions button{background:var(--card);border:1px solid var(--line);color:var(--tx3);height:26px;min-width:26px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:.65rem;transition:all .12s}
.tactions button:hover{color:var(--acc);border-color:var(--acc);background:var(--card2)}

/* arrastrar y soltar */
.drag{cursor:grab;color:var(--tx3);font-size:.74rem;line-height:1;padding:4px 2px;margin-top:1px;flex-shrink:0;opacity:.35;transition:.12s;user-select:none;touch-action:none}
.task:hover .drag{opacity:.9;color:var(--acc)}
.drag:active{cursor:grabbing}
.task.dragging{opacity:.35;background:var(--card2)}
.task.dropbefore{box-shadow:inset 0 3px 0 -1px var(--acc)}
.task.dropafter{box-shadow:inset 0 -3px 0 -1px var(--acc)}

/* ============ COLUMNAS Y CONTENEDORES DE DÍAS (PLANIFICACIÓN) ============ */
.day-dropzone{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);margin-bottom:14px;transition:border-color .15s,box-shadow .15s,background .15s}
.day-dropzone.drop-target-active{border-color:var(--acc) !important;background:var(--acc-soft) !important;box-shadow:0 0 0 2px var(--acc-line)}
.day-dropzone h3{font-size:.9rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.day-dropzone .drop-hint{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--tx3);font-size:.76rem;margin-top:6px;transition:all .15s}
.day-dropzone.drop-target-active .drop-hint{border-color:var(--acc);color:var(--acc);background:rgba(255,255,255,.2)}
.quick-day-shift{display:flex;gap:4px;align-items:center}

/* selección múltiple */
.task.sel{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.task.sel:hover{background:var(--acc-soft)}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-lg);z-index:110;display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:min(96vw,980px);transition:transform .2s cubic-bezier(.16,1,.3,1),opacity .2s;opacity:0}
#selbar.show{transform:translateX(-50%) translateY(0);opacity:1}
#selbar .selcount{font-size:.79rem;color:var(--tx2);padding:0 6px;white-space:nowrap}
#selbar .selcount b{color:var(--acc);font-size:.95rem}
body.selbar-on #main{padding-bottom:230px}
@media(max-width:720px){#selbar{bottom:8px;padding:8px;gap:4px}#selbar .btn{padding:5px 8px;font-size:.7rem}}

/* ============ CALENDARIO MODERNO ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700;text-align:center;padding:6px 0}
.cal .day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;cursor:pointer;font-size:.7rem;position:relative;transition:all .14s;display:flex;flex-direction:column}
.cal .day:hover{border-color:var(--acc-line);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.cal .day.out{opacity:.4;background:transparent}
.cal .day.today{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.cal .dnum{font-weight:700;font-size:.74rem;color:var(--tx2);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.cal .dnum .dmin{font-weight:600;color:var(--tx3);font-size:.62rem}
.cal .ev{border-radius:5px;padding:2px 6px;margin-bottom:3px;font-size:.63rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;cursor:pointer;line-height:1.3}
.cal .more{color:var(--tx3);font-size:.62rem;padding-left:4px;margin-top:auto}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
@media(max-width:900px){.week{grid-template-columns:1fr}}
.wday{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.wday.today{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.wday h5{font-size:.72rem;font-weight:700;display:flex;justify-content:space-between;margin-bottom:7px;color:var(--tx2);text-transform:capitalize}
.wtask{font-size:.7rem;padding:4px 7px;border-radius:6px;margin-bottom:4px;cursor:pointer;display:flex;gap:6px;align-items:center}
.wtask:hover{background:var(--hover)}
.wtask.done{text-decoration:line-through;color:var(--tx3)}
.dotc{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ============ COMENTARIOS EN TAREAS ============ */
.comment-bubble{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.79rem;display:flex;flex-direction:column;gap:3px;position:relative}
.comment-head{display:flex;align-items:center;justify-content:space-between;font-size:.68rem;color:var(--tx3)}
.comment-text{color:var(--tx);white-space:pre-wrap;word-break:break-word}

/* ============ SERIES ============ */
.series-dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin:6px 0}
.series-dot{width:10px;height:10px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.series-dot.done{background:var(--ok);border-color:var(--ok)}
.series-dot.today{background:var(--acc);border-color:var(--acc)}
.series-dot.overdue{background:var(--bad);border-color:var(--bad)}

/* ============ MODALES ============ */
.mbg{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 14px}
.mbg.open{display:flex}
#modalbg{z-index:80}#confirmbg{z-index:95}#searchbg{z-index:85}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(580px,96vw);box-shadow:var(--shadow-lg);margin:auto 0;animation:modalIn .18s cubic-bezier(.16,1,.3,1)}
.modal.narrow{width:min(440px,96vw)}
.modal.wide{width:min(780px,96vw)}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.modal h3{margin-bottom:14px;font-size:1.05rem;font-weight:700}
.modal label{display:block;font-size:.68rem;color:var(--tx2);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.modal input,.modal select,.modal textarea{width:100%;background:var(--card2);border:1px solid var(--line);padding:8px 11px;border-radius:8px;font-size:.84rem;transition:border-color .14s}
.modal textarea{resize:vertical;min-height:64px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.mrow{display:flex;gap:10px}.mrow>div{flex:1;min-width:0}
.mfoot{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.mfoot .grow{flex:1}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.8rem;font-weight:600;opacity:0;transition:.22s cubic-bezier(.16,1,.3,1);z-index:120;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-lg);pointer-events:none;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:transparent;border:none;color:var(--acc);font-weight:700;cursor:pointer;font-size:.8rem;filter:brightness(1.4)}

/* hábitos */
.habitrow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line2)}
.habitrow:last-child{border-bottom:none}
.hgrid{display:flex;gap:3px;flex-wrap:wrap}
.hcell{width:12px;height:12px;border-radius:3px;background:var(--card2)}
.hcell.on{background:var(--acc)}
.hcell.today{outline:1.5px solid var(--acc)}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.statgrid .card{margin:0;padding:14px 16px}
svg text{user-select:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bars .bar{width:68%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--acc);opacity:.85}

/* filtros y chips */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.76rem}
kbd{background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:.7rem;font-family:inherit;font-weight:600}
.subrow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px}
.subrow:hover{background:var(--hover)}
.iconchip{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.74rem;color:#fff;flex-shrink:0}
footer{text-align:center;margin-top:34px;color:var(--tx3);font-size:.72rem}

@media(max-width:700px){
  #searchbox{display:none}
  #nextEv{display:none}
  #topbar .date{display:none}
  .cal .day{min-height:68px}
}
@media print{#topbar,#sidebar{display:none}}
</style>
</head>
<body>
<header id="topbar">
  <button class="iconbtn" id="btnMenu" title="Menú" aria-label="Abrir menú">☰</button>
  <div class="logo" onclick="go('home')"><span class="mark">Au</span><span>Aula</span></div>
  <span class="date" id="topDate"></span>
  <div class="spacer"></div>
  <button id="nextEv" title="Próximo evento importante" onclick="go('evals')"></button>
  <div id="searchbox"><input id="topSearch" placeholder="Buscar…  ( / )" readonly onclick="openSearch()" aria-label="Buscar"></div>
  <span id="saveInd"><span class="dot"></span><span id="saveTxt">guardado</span></span>
  <button class="iconbtn" title="Ver en el celular o sincronizar" aria-label="Celular" onclick="openMobileGuideModal()" style="font-size:1.05rem">📱</button>
  <button class="iconbtn" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
  <button class="iconbtn" title="Agregado rápido (N)" aria-label="Agregado rápido" onclick="openQuick()" style="font-size:1.25rem;font-weight:600">+</button>
